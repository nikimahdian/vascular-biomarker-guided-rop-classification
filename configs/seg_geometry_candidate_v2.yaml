# --- predeclared gate and its result ---------------------------------------------------
predeclared_gate:
  width_median_abs_geometry_bias_max: 0.05
  width_min_reduction_vs_v1: 0.50
  tortuosity_median_abs_geometry_bias_max: 0.05
  tortuosity_min_reduction_vs_v1: 0.50
  density_max_abs_relative_change: 0.01
gate_result:
  V2_SYNTHETIC_GEOMETRY: FAIL
  width_median_abs_bias_v1: 0.1228
  width_median_abs_bias_v2: 0.1440
  width_reduction_vs_v1: -0.173
  tortuosity_median_abs_bias_v1: 0.0207
  tortuosity_median_abs_bias_v2: 0.0562
  tortuosity_reduction_vs_v1: -1.710
  density_median_abs_change_v1: 0.0061
  density_median_abs_change_v2: 0.0005
  density_pass: true
  evidence_table: artifacts/v1_v2_synthetic_geometry.csv
  mechanism: >-
    at a square geometry both paths are the same spatial map and still carry a -10.6% width
    bias, so the 256x256 round trip dominates and the <=5% absolute criterion is unreachable
    by any geometry policy at this input size. Isolated against V1, letterboxing does not
    reduce the bias and worsens tortuosity by +1.8% to +4.1%, because V1 stretched the short
    axis up to 256 while V2 downsamples it isotropically (640x480: x1.875 vs x2.500).
  consequence:
    V2_HVDROPDB_EVALUATION_RUN: NO
    V2_RETCAM_SEGMENTATION_NONINFERIORITY: NOT_RUN
