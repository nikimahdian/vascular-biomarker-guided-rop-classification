store_layout: per_generation_directory

# --- the ONLY difference from SEG_CURRENT_V1 ------------------------------------------
difference_from_v1: spatial mapping between native RGB geometry and the 256x256 model input
geometry_policy: ASPECT_PRESERVING_LETTERBOX
geometry_algorithm:
  scale: "s = min(256 / H, 256 / W)"
  resize_to: "round(H*s) x round(W*s)"
  resize_interpolation: "PIL.Image.BILINEAR (same family as V1's torchvision Resize)"
  pad_to: "256x256"
  pad_value: "0 (black); ToTensor scales uint8 [0,255] to float [0,1], so the border is 0.0 in tensor space"
  pad_placement: "floor excess on top/left, remaining pixel on bottom/right when odd"
  inverse: >-
    post_process at 256x256, then crop the letterbox bands, then cv2.resize to native with
    INTER_NEAREST. Threshold timing is identical to V1; only the crop is inserted.
explicitly_not_attempted:
  - reflection padding
  - edge padding
  - alternative letterbox fill values
  - alternative target sizes
  - crop variants
  - patching
  - tiling
  - test-time augmentation

