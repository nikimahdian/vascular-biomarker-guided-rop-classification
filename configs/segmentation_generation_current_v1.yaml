# Immutable segmentation generation contract.
#
# SEG_CURRENT_V1 is the vessel-mask generation that produced the masks currently on disk
# under data/masks/ (mtime 2026-08-30 07:21-07:26) and consumed by the canonical cohort
# pairing in data/masks/mask_manifest_canonical_v1.csv.
#
# This is NOT the generation that produced the historical biomarker table of 2026-08-27.
# That generation is unrecoverable (see docs/HISTORICAL_SEGMENTATION_RECOVERY.md).
# SEG_CURRENT_V1 must never be described as historical-equivalent.
#
# The store below is FROZEN. Its bytes are the reference for the canonical cohort and must
# not be recomputed in place. Any change to the checkpoint, code, config, preprocessing,
# threshold or postprocessing requires a NEW generation_id and a NEW contract.
#
# Verify with: python -m src.segmentation.verify_generation --generation SEG_CURRENT_V1

generation_id: SEG_CURRENT_V1
created_at: "2026-09-20T22:30:00+0330"
supersedes: null
store_frozen: true
output_store: data/masks
store_layout: flat_legacy_frozen

# --- model identity -------------------------------------------------------------------
architecture: MAnet
architecture_source: "segmentation_models_pytorch MAnet"
encoder: resnet34
encoder_weights_at_inference: null
in_channels: 3
classes: 1
checkpoint_path: weights/best_weight_DeepLabV3+_resize_27
checkpoint_sha256: c373f53813ee60b89651a04a98bc5f1d6bc60a5a50f45c4e10f42475650d5374
checkpoint_size_bytes: 127358298
checkpoint_state_dict_entries: 366
checkpoint_note: >-
  The filename says DeepLabV3+ but the architecture is MAnet; the bytes are byte-identical
  to the Google Drive artifact best_weight_MAnet_res34_resize_31. Do not rename the file.

# --- preprocessing --------------------------------------------------------------------
input_loader: "PIL.Image.open(path).convert('RGB')"
input_size: [256, 256]
resize_policy: >-
  torchvision.transforms.Resize((256, 256)) on the RGB PIL image, default bilinear
  interpolation, applied before ToTensor
aspect_ratio_policy: >-
  aspect ratio is NOT preserved; 640x480, 1240x1240, 1280x960, 1440x1080 and 1600x1200
  inputs are all stretched to a 256x256 square
normalization: >-
  NONE beyond ToTensor scaling to [0, 1]. No ImageNet or dataset mean/std normalisation is
  applied anywhere in the inference path.

# --- decision rule --------------------------------------------------------------------
activation: "torch.sigmoid on the single-channel model output"
logit_handling: "raw logits are passed through sigmoid exactly once; no temperature or clipping"
threshold: 0.20
binarization_operator: "strict greater-than: (prob > threshold)"
connected_component_policy: >-
  cv2.connectedComponentsWithStats(connectivity=8) on the binarised 256x256 map; every
  component with area < minimum_component_area is removed
minimum_component_area: 50
morphological_operations: >-
  cv2.morphologyEx(MORPH_CLOSE) with a 3x3 uint8 kernel of ones, applied AFTER component
  removal
postprocessing_order: "threshold -> connected-component removal -> morphological close"
postprocessing_implementation: "src/segmentation/infer_masks.py::post_process"

# --- output ---------------------------------------------------------------------------
binary_output_values: [0, 255]
output_dtype: "uint8, single channel, PNG written by cv2.imwrite"
output_resize_policy: >-
  cv2.resize(mask_256, (orig_w, orig_h), interpolation=cv2.INTER_NEAREST) back to the
  source image size
filename_policy: >-
  "<image_stem>_<md5(image_path)[:8]>.png". The suffix is a hash of the image PATH, not of
  the mask bytes, so a re-run targets the same filename. Provenance is therefore determined
  by content identity (image_sha256, generation_id, mask_sha256) and never by filename.
mask_readback_threshold: ">127, in src/biomarker/extract_pvbm.py::load_binary_mask"

# --- device ---------------------------------------------------------------------------
device_policy: "src.utils.common.get_device(): cuda if available, else mps, else cpu"
device_used_for_this_generation: "mps (Apple silicon) on the analysis host"

# --- code and config identity ---------------------------------------------------------
inference_script: src/segmentation/infer_masks.py
inference_script_sha256: b76f820025353841908111674a9ca3460776f7add496d6c2a27ff4bbf09f1a1b
config_sha256: 77a6c9230fd8b6f7230e1085d3415f46ece862d3e160ace983a1be83b97f0a60

# --- population -----------------------------------------------------------------------
canonical_population_fingerprint: 0d4c3b3a60761ca1bda88924dbc0cbf6f1be604a6e10dd5e981e40b73f05f9c8
canonical_population_n: 8870
canonical_population_file: data/splits/all.csv
