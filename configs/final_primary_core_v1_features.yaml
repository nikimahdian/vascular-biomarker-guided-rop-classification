feature_set: FINAL_PRIMARY_CORE_V1
status: FROZEN before any disease-model performance was seen
measurement_version: CLINICAL_MEASUREMENT_V1
segmentation_generation: SEG_CURRENT_V1
purpose: the feature set for the main Branch A and Branch C biomarker experiment
n_features: 5
features:
- vessel_density_fov
- skel_density_fov
- fractal_d0
- fractal_d1
- fractal_d2
selection_rule: disc-independent, no QC, no metadata, no exploratory and no forbidden feature. Every member
  has small or negligible systematic bias in BOTH cameras and ICC(2,1) >= 0.56 in the weaker camera. Selection
  used measurement evidence only; no label, AUC or feature importance was consulted.
external_evidence:
