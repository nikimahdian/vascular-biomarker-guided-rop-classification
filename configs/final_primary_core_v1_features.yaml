    bias +0.0001 MAE 0.0129 rho 0.751
  skel_density_fov: RetCam ICC 0.933 [0.886,0.998] bias -0.0016 MAE 0.0016 rho 0.951; Neo ICC 0.547 bias
    -0.0050 MAE 0.0051 rho 0.816
  fractal_d0: RetCam ICC 0.940 [0.897,0.999] bias -0.0183 MAE 0.0202 rho 0.932; Neo ICC 0.569 bias -0.0779
    MAE 0.0786 rho 0.820
  fractal_d1: RetCam ICC 0.923 [0.870,0.998] bias -0.0246 MAE 0.0260 rho 0.927; Neo ICC 0.578 bias -0.0817
    MAE 0.0821 rho 0.830
  fractal_d2: RetCam ICC 0.911 [0.851,0.997] bias -0.0273 MAE 0.0291 rho 0.924; Neo ICC 0.566 bias -0.0817
