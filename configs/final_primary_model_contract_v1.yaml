# FINAL PRIMARY MODEL CONTRACT v1 — frozen before any disease-model training.
#
# Nothing in this file may be changed on the basis of test-set results. Any later experiment that
# changes an entry here is SECONDARY and must be reported as such.

contract_version: final_primary_model_contract_v1
frozen_on: "2026-09-22"
status: FROZEN_BEFORE_TRAINING
trained_in_this_task: false
test_auc_computed_in_this_task: false

# --- A. frozen input population --------------------------------------------------------------
population:
  manifest: data/splits/primary_complete_case_v2.csv
  total_n: 8862
  train_n: 6203
  val_n: 1328
  test_n: 1331
  group_n: 414
  exclusions: 8
  exclusion_reason: "fractal_d0/d1/d2 = NaN from the multifractal estimator's exception path"
  imputation: none
  all_four_models_use_identical_population: true
  counts_by_split_and_label:
    train: {0: 4490, 1: 650, 2: 1063}
    val:   {0: 981,  1: 140, 2: 207}
    test:  {0: 982,  1: 140, 2: 209}
  counts_by_source: {plus: 5925, farfum_rop: 1528, farabi: 1409}
  counts_by_source_and_label:
    farabi:     {0: 369, 1: 452, 2: 588}
    farfum_rop: {0: 780, 1: 478, 2: 270}
    plus:       {0: 5304, 1: 0,  2: 621}

# --- B. frozen data lineage ------------------------------------------------------------------
lineage:
  biomarkers: FINAL_BIOMARKERS_V2
  biomarker_table: data/features/final_biomarkers_v2.csv
  biomarker_table_sha256: b4661dffd2e082f93d183cdb26ae0462dce8af32b135c1968db2deacc493365e
  segmentation_lineage: SEG_CURRENT_V2_RESOLVER_SAFE
  segmentation_pixel_equivalent_to: SEG_CURRENT_V1
  segmentation_checkpoint_sha256: c373f53813ee60b89651a04a98bc5f1d6bc60a5a50f45c4e10f42475650d5374
  canonical_split_fingerprint: 0d4c3b3a60761ca1bda88924dbc0cbf6f1be604a6e10dd5e981e40b73f05f9c8
  canonical_mask_manifest: data/masks/mask_manifest_canonical_v1.csv
  canonical_mask_manifest_sha256: b3bc6538026d6ad0fc1342043e5ca2d6de56662233bf6d0709d9d875f24b21cd
  historical_contaminated_tables_permitted: false

# --- C. fixed label space --------------------------------------------------------------------
labels:
  source: configs/config.yaml
  class_names: ["Normal", "Pre_Plus", "Plus"]
  encoding: {0: Normal, 1: Pre_Plus, 2: Plus}
  identical_mapping_for_all_models: true

# --- D. Model A ------------------------------------------------------------------------------
A_PRIMARY:
  features: [vessel_density_fov, skel_density_fov, fractal_d0, fractal_d1, fractal_d2]
  feature_n: 5
  forbidden_inputs: [RGB, CNN embedding, secondary biomarker, disc feature, tortuosity, A/V,
                     exploratory feature, QC field]
  classifier: XGBoost multiclass softprob
  selection_data: train+val only

# --- E/F. Model B ----------------------------------------------------------------------------
B_RGB:
  architecture: EfficientNet-B5
  implementation: "timm.create_model('efficientnet_b5', pretrained=True, num_classes=0, global_pool='avg')"
  historical_config_recovered: partial
  historical_source_files:
    - src/classify/branch_b_cnn.py
    - scripts/train_plus_replica.py
  frozen_configuration:            # chosen once, before training, and frozen
    input_resolution: 384
    resize_policy: "Resize((384,384)) on the RGB PIL image, aspect ratio not preserved"
    normalization: "ImageNet mean [0.485,0.456,0.406], std [0.229,0.224,0.225]"
    pretrained_initialization: "timm ImageNet weights"
    classification_head: "Dropout(p=0.2) -> Linear(num_features, 3); num_features = 2048 for b5"
    optimizer: AdamW
    learning_rate: 1.0e-5
    weight_decay: 1.0e-4
    batch_size: 16
    max_epochs: 40
    early_stopping: "patience 8 epochs on validation loss"
    checkpoint_selection_metric: "frozen multiclass ROC-AUC (see metrics.multiclass_roc_auc)"
    one_architecture_only: true
    alternative_backbones_searched: false
  train_only_augmentation:
    horizontal_flip: 0.5
    rotation_degrees: 10
    random_resized_crop_scale: [0.95, 1.0]
    color_jitter: {brightness: 0.10, contrast: 0.10, saturation: 0.10, hue: 0.00}
    anatomy_changing_transforms: prohibited
    val_test_augmentation: none

# --- G. class imbalance ----------------------------------------------------------------------
class_weighting:
  formula: "weight_k = N_train / (K * N_train_k), K=3, computed on TRAIN only"
  train_only: true
  computed_values:
    0: 0.46051
    1: 3.18103
    2: 1.94512
  B_RGB: "weighted cross-entropy with these weights"
  xgboost: "equivalent per-sample training weights derived from the same train class weights"
  val_test_reweighting_or_oversampling: none
  tuned_on_test: false

# --- H. checkpoint and embedding -------------------------------------------------------------
B_checkpoint:
  selection_data: validation only
  tie_break_order: [higher validation macro F1, lower validation loss, earlier epoch]
  frozen_checkpoint: weights/branch_b_cnn_final.pth        # produced by Task 6 training
  historical_reference_checkpoint: weights/branch_b_efficientnet_b5.pth
  historical_reference_checkpoint_sha256:
    ef5667d305fdf79a7c4cb1c8c981e797dfe09f46ce66f8d320235275cae28299
  single_checkpoint_for_all_downstream_embeddings: true

embedding:
  layer: "backbone global-pooled output (timm global_pool='avg'), immediately before Dropout+Linear"
  dimension: 2048
  extraction_code: src/classify/branch_b_cnn.py (timm num_classes=0 path)
  test_labels_used_during_extraction: false
  extracted_for_n: 8862

# --- J/K/L. downstream classifiers -----------------------------------------------------------
B_EMBEDDING_ONLY:
  input: [frozen B embedding]
  classifier: XGBoost multiclass softprob
  purpose: "isolate the incremental contribution of the five biomarkers"

C_PRIMARY:
  input: [frozen B embedding, vessel_density_fov, skel_density_fov, fractal_d0, fractal_d1,
          fractal_d2]
  classifier: XGBoost multiclass softprob
  other_features: none

downstream_xgboost:
  hyperparameters_shared_by: [B_EMBEDDING_ONLY, C_PRIMARY]
  selection_data: "B_EMBEDDING_ONLY, train+val only"
  selection_protocol: "small predeclared grid below, selected on validation, then FROZEN"
  search_space:
    n_estimators: [200, 500]
    max_depth: [3, 5]
    learning_rate: [0.05, 0.10]
    subsample: [0.8]
    colsample_bytree: [0.8]
    min_child_weight: [1]
    reg_lambda: [1.0]
  objective: multi:softprob
  eval_metric: mlogloss
  retuned_for_C_PRIMARY: false
  A_PRIMARY_search_space:
    n_estimators: [200, 500, 800]
    max_depth: [2, 3, 4]
    learning_rate: [0.03, 0.05, 0.10]
    subsample: [0.8, 1.0]
    colsample_bytree: [0.8, 1.0]
    min_child_weight: [1]
    reg_lambda: [1.0]

# --- N. randomness ---------------------------------------------------------------------------
seeds:
  canonical_project_seed: 42
  source: "cfg['seed'] default in src/classify/trainer.py and scripts/train_plus_replica.py"
  torch: 42
  numpy: 42
  python_random: 42
  xgboost: 42
  split_order: "canonical split files, fixed; loader order deterministic"
  primary_result_from_single_seed: true
  additional_seed_stability: SECONDARY

# --- O/P. metrics ----------------------------------------------------------------------------
metrics:
  multiclass_roc_auc: "sklearn.metrics.roc_auc_score(y_true, P, multi_class='ovr', average='macro')
                       on the raw 3-column softmax probabilities of the frozen test split"
  macro_ovr_roc_auc: same_as_multiclass_roc_auc
  per_class_roc_auc: "one-vs-rest AUC for each of Normal, Pre_Plus, Plus"
  balanced_accuracy: true
  macro_f1: true
  confusion_matrix: true
  per_image_output: [image_id, group_id, source, true_class, p_normal, p_pre_plus, p_plus,
                     predicted_class]
calibration:
  multiclass_brier_score: true
  ece: "top-label expected calibration error, 15 fixed equal-width confidence bins"
  reliability_diagram: true
  primary_metrics_use_raw_probabilities: true
  temperature_scaling: "not applied to primary test probabilities"

source_breakdown:
  report_for: [plus, farfum_rop, farabi]
  tuning_by_source: false
  architecture_change_by_subgroup: false

test_set_status:
  language: CANONICAL_LOCKED_SPLIT_REANALYSIS
  forbidden_language: [untouched test set, pristine confirmatory test,
                       fully independent confirmatory validation]
  external_and_loso_validation: separate

# --- S. primary question ---------------------------------------------------------------------
primary_comparison:
  models: [B_EMBEDDING_ONLY, C_PRIMARY]
  question: "Do the five frozen interpretable vascular biomarkers add complementary predictive
             information beyond the frozen CNN representation?"
  C_must_outperform: false
  null_or_negative_result_is_valid: true

# --- T/U. prohibited post-hoc changes --------------------------------------------------------
prohibited_after_test_predictions:
  - add or remove biomarkers
  - change fusion architecture
  - change classifier
  - change class weights
  - change preprocessing
  - tune thresholds
  - choose another CNN checkpoint
  - search for a better seed
secondary_reserved_for_after_primary_result:
  - VESSEL_MAP_CNN
  - SmartPlus-like literature biomarkers
  - LOSO
  - additional random seeds
  - DANN/MMD
  - GNN
  - foundation-model embeddings
  - expanded sensitivity analyses
